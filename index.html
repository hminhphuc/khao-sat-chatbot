<style>
/* One narrow column, one task per screen, no progress strip or counters (kept deliberately plain). */
:root {
  --bg: #eef2f8;
  --paper: #ffffff;
  --ink: #142036;
  --muted: #5a6780;
  --line: #d5dceb;
  --accent: #1d4fb8;
  --brand: #15489F;
  --brand-ink: #0E326F;
  --brand-red: #C5050C;
  --accent-ink: #ffffff;
  --accent-soft: #e3ebfb;
  --marker: #f2b632;
  --marker-soft: #fdf3d8;
  --ok: #1f7a4d;
  --warn: #b0451f;
  --warn-soft: #fbe9e2;
  --shadow: 0 1px 2px rgba(20, 32, 54, .06), 0 4px 16px rgba(20, 32, 54, .05);
  --f-display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --f-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1522; --paper: #172034; --ink: #e6ebf5; --muted: #9aa6bf; --line: #2a3650;
    --accent: #7fa6ff; --accent-ink: #0d1424; --accent-soft: #1e2c4d;
    --brand: #8fb0ff; --brand-ink: #e6ebf5; --brand-red: #ff6b6b;
    --marker: #f2c14e; --marker-soft: #3a3120; --ok: #5fd39a;
    --warn: #ff9a73; --warn-soft: #3a2119;
    --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1522; --paper: #172034; --ink: #e6ebf5; --muted: #9aa6bf; --line: #2a3650;
  --accent: #7fa6ff; --accent-ink: #0d1424; --accent-soft: #1e2c4d;
  --brand: #8fb0ff; --brand-ink: #e6ebf5; --brand-red: #ff6b6b;
  --marker: #f2c14e; --marker-soft: #3a3120; --ok: #5fd39a;
  --warn: #ff9a73; --warn-soft: #3a2119;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
}
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 72px;
  display: flex; flex-direction: column; gap: 18px;
}
h1 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -.01em; font-size: clamp(1.6rem, 4.4vw, 2.2rem); font-weight: 800; line-height: 1.15; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
/* formal letterhead: official TDTU logo + faculty name, then centered title */
.head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; }
.lockup { display: flex; align-items: center; justify-content: center; gap: 14px; text-align: left; }
.lockup img { height: 64px; width: auto; display: block; background: #fff; border-radius: 6px; padding: 2px; }
.lockup .sep { width: 1px; align-self: stretch; background: var(--line); }
.lockup .names { display: flex; flex-direction: column; gap: 2px; }
.lockup .uni { font-size: .78rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.lockup .fac { font-size: 1.02rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--brand); }
.head .rule { width: 72px; height: 2px; background: var(--brand-red); margin: 16px auto 12px; border: 0; }
.head .form-title { font: 700 clamp(1.35rem, 3.6vw, 1.7rem) var(--f-body); letter-spacing: .03em; text-transform: uppercase; margin: 0; color: var(--brand-ink); }
.head .form-sub { font: 600 clamp(1rem, 2.6vw, 1.12rem) var(--f-body); color: var(--muted); text-wrap: balance; }
@media (max-width: 480px) {
  .lockup { flex-direction: column; gap: 10px; text-align: center; }
  .lockup .sep { display: none; }
}
.eyebrow { font-size: .74rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.preview-note { background: var(--marker-soft); border: 1px dashed var(--marker); border-radius: 10px; padding: 10px 14px; font-size: .88rem; }

.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 24px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 20px; }
.notice { background: var(--accent-soft); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.notice .sign { font-weight: 600; }
.notice p:not(.sign) { text-indent: 2em; text-align: justify; hyphens: none; }

/* fields */
.field { display: flex; flex-direction: column; gap: 8px; border-radius: 10px; }
.field > .label { font-weight: 600; }
.field.missing { background: var(--warn-soft); outline: 2px solid var(--warn); outline-offset: 6px; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { position: relative; }
.opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.opt span { display: inline-block; border: 1px solid var(--line); border-radius: 9px; padding: 7px 12px; background: var(--paper); font-size: .92rem; cursor: pointer; user-select: none; }
.opt input:checked + span { background: var(--accent-soft); border-color: var(--accent); font-weight: 600; }
.opt input:checked + span::before { content: "✓ "; color: var(--accent); }
.opt input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea, input.text {
  width: 100%; font: inherit; color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; resize: vertical; min-height: 70px;
}
textarea:focus, input.text:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
input.text { min-height: 0; }

/* question screen: one guide box whose hint changes after every "Thêm câu" */
.guide { background: var(--marker-soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; font-size: .94rem; }
.guide .hint { font-weight: 600; }
.qboxes { display: flex; flex-direction: column; gap: 12px; }
.qbox { display: flex; gap: 10px; align-items: flex-start; }
.qbox-n { flex: none; width: 28px; height: 28px; margin-top: 8px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font: 700 .85rem var(--f-body); display: grid; place-items: center; }
.qbox textarea { min-height: 58px; }
.qbox-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.qcount { font-size: .78rem; color: var(--muted); text-align: right; min-height: 1em; }
.qcount.warn { color: var(--warn); font-weight: 600; }
.qbox textarea::placeholder { color: var(--muted); opacity: .75; }

/* buttons */
.btn { font: 600 .95rem var(--f-body); border-radius: 10px; padding: 11px 20px; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); }
/* thank-you screen */
.sheet.done { align-items: center; text-align: center; gap: 14px; padding-block: 32px; }
.done-mark { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); border: 2px solid var(--ok); margin-top: 4px; }
.done-text { max-width: 520px; color: var(--ink); }
.done .form-title { font: 700 clamp(1.35rem, 3.6vw, 1.7rem) var(--f-body); letter-spacing: .02em; color: var(--brand-ink); margin: 0; }
.done-again { margin-top: 4px; }
/* question screen: "add" is the main action, "finish" is visibly secondary so it is not hit by mistake */
.btn.add { padding: 13px 26px; font-size: 1.02rem; box-shadow: 0 2px 8px rgba(29, 79, 184, .25); }
.btn.quiet { border-color: var(--line); color: var(--muted); font-weight: 500; }
.btn.quiet:hover { border-color: var(--muted); color: var(--ink); }
.btn.link { border: 0; background: transparent; color: var(--muted); padding: 4px 6px; font-size: .84rem; text-decoration: underline; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.nav { display: flex; gap: 10px; justify-content: space-between; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); padding-top: 16px; }
.err { color: var(--warn); font-size: .9rem; font-weight: 600; flex-basis: 100%; }
.err:empty { display: none; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--paper); padding: 10px 14px; border-radius: 10px; font-size: .9rem; z-index: 20;
  max-width: calc(100% - 32px);
}
@media (max-width: 520px) {
  .sheet { padding: 16px; }
  .nav .btn { flex: 1; }
  .qnav { flex-direction: column; align-items: stretch; gap: 12px; }
  .qnav .btn { flex: none; }
  .qbox textarea { min-height: 86px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

  // ---------- state ----------

  function pick(n) { return Math.floor(Math.random() * n); }
  // returns [topicIndex, lineIndex]; avoids repeating the previous topic

  }
  function hintText(h) {

  function shuffledHints() {

    for (var i = all.length - 1; i > 0; i--) { var j = pick(i + 1), x = all[i]; all[i] = all[j]; all[j] = x; }

  }

      profile: blankProfile(), boxes: blankBoxes(SURVEY.boxes || 0), boxHints: shuffledHints(), questions: [], composer: blankComposer(), hint: randomHint(null),
      closing: { style: [], ready: "", worries: [], feedback: "" }, submitted: false };
  }
  function load() {
    try { var raw = localStorage.getItem(CONFIG.DRAFT_KEY); if (!raw) return null; var s = JSON.parse(raw); return s && s.id && !s.submitted ? s : null; }
    catch (e) { return null; }
  }
  var state = load() || fresh();
  var saveT;
  function save() {

  }

  // ---------- helpers ----------
  var app = document.getElementById("app");
  function $(sel) { return app.querySelector(sel); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function filled(v) { return Array.isArray(v) ? v.length > 0 : !!(v && String(v).trim()); }
  function checkedValues(el) { return Array.prototype.map.call(el.closest(".opts").querySelectorAll("input:checked"), function (x) { return x.value; }); }

  var toastT;
  function toast(msg) {

  // steps by name; the profile page is skipped when a survey has no profile questions
  var STEPS = PROFILE.length ? ["intro", "profile", "questions", "closing"] : ["intro", "questions", "closing"];
  var STEP_Q = STEPS.indexOf("questions"), STEP_END = STEPS.length - 1;
  function missing(step) {
    if (STEPS[step] === "profile") return PROFILE.filter(function (f) { return f.req !== false && !filled(state.profile[f.id]); }).map(function (f) { return "p_" + f.id; });
    if (step === STEP_Q) return (SURVEY.boxes ? boxQuestions().length : state.questions.length) ? [] : ["q"];
    if (step === STEP_END) return CLOSING.filter(function (f) { return f.req && !filled(state.closing[f.id]); }).map(function (f) { return "c_" + f.id; });
    return [];
  }
  function missingMsg(step, list) {
    if (step === STEP_Q) return "Vui lòng viết ít nhất một câu hỏi.";

  }
  function markMissing(list) {
    Array.prototype.forEach.call(app.querySelectorAll(".missing"), function (el) { el.classList.remove("missing"); });

    if (first) first.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  function optionGroup(name, options, value, multi) {

  var VIEWS = { intro: viewIntro, profile: viewProfile, questions: viewQuestions, closing: viewClosing };

  function composerError(c) {

  // non-empty boxes, in order (boxes shorter than MIN_LEN are reported by boxError)
  function boxQuestions() {

  // text under a box: empty when blank, "còn thiếu" when too short, a running count otherwise
  function countInfo(text) {
    var n = text.trim().length;
    if (!n) return { text: "", warn: false };
    if (n < CONFIG.MIN_LEN) return { text: "Còn thiếu " + (CONFIG.MIN_LEN - n) + " ký tự (tối thiểu " + CONFIG.MIN_LEN + ")", warn: true };

    return { text: fmt(text.length) + " / " + fmt(CONFIG.MAX_LEN) + " ký tự", warn: false };

  function boxError() {
    var shortOnes = [];
    (state.boxes || []).forEach(function (b, i) { var t = b.text.trim(); if (t && t.length < CONFIG.MIN_LEN) shortOnes.push(i + 1); });

  }

  // ---------- submit ----------
  function payload() {
    var qs = (SURVEY.boxes ? boxQuestions() : state.questions).map(function (q, i) {

    });
    return { survey: SURVEY_ID, version: CONFIG.VERSION, id: state.id, consent: state.consent, startedAt: state.startedAt, profile: state.profile,
      questions: qs, closing: state.closing };
  }

  function submit() {
    for (var i = 1; i <= STEP_END; i++) {
      var m = missing(i);
      if (m.length) { if (i !== state.step) goStep(i); showErr(missingMsg(i, m)); markMissing(m); return; }
    }
    var btn = document.getElementById("nextBtn");
    var data = payload();
    function done() { state.submitted = true; clearDraft(); render(); window.scrollTo(0, 0); }
    if (!LIVE) { done(); return; }
    btn.disabled = true; btn.textContent = "Đang gửi…";
    function fail(err) {
      btn.disabled = false; btn.textContent = "Gửi lại";
      showErr("Chưa gửi được: " + (err && err.message ? err.message : "lỗi mạng") + ". Phần đã làm vẫn còn trên máy, vui lòng bấm Gửi lại sau ít phút.");
    }

      google.script.run.withSuccessHandler(done).withFailureHandler(fail).submit(data);

    fetch(ENDPOINT, { method: "POST", body: JSON.stringify(data), credentials: "omit", redirect: "follow",

      .then(function (res) { if (res && res.ok) done(); else fail(new Error(res && res.error ? res.error : "máy chủ không nhận phiếu")); })
      .catch(fail);
  }

  // ---------- events ----------
  document.addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t || !app.contains(t)) return;
    var act = t.dataset.act;
    if (act === "saveq") {
      if (saveComposer()) {
        render();
        toast("Đã lưu. Mời viết câu tiếp theo.");
        $("#cText").focus({ preventScroll: true });
        $(".guide").scrollIntoView({ block: "start", behavior: "smooth" });
      }
      return;
    }
    if (act === "more") { state.boxes = state.boxes.concat(blankBoxes(5)); save(); var y = window.scrollY; render(); window.scrollTo(0, y); return; }
    if (act === "next") {
      if (state.step === STEP_Q && SURVEY.boxes) { var be = boxError(); if (be) { showErr(be); return; } }
      if (state.step === 0) state.consent = true; // consent is the "Bắt đầu" click after reading the notice
      if (state.step === STEP_Q && !SURVEY.boxes && state.composer.text.trim() && !saveComposer()) return; // keep the last unsaved question
      var m = missing(state.step);
      if (m.length) { showErr(missingMsg(state.step, m)); markMissing(m); return; }
      goStep(state.step + 1); return;
    }
    if (act === "prev") { goStep(Math.max(0, state.step - 1)); return; }
    if (act === "submit") { submit(); return; }
    if (act === "reset" || act === "again") { clearDraft(); state = fresh(); render(); window.scrollTo(0, 0); return; }
  });

  document.addEventListener("input", function (e) {
    var el = e.target, c = state.composer;
    if (!app.contains(el)) return;
    showErr("");
    if (el.dataset.box) {
      var b = state.boxes[+el.dataset.box]; b.text = el.value; if (!el.value.trim()) b.pasted = false; save();
      var c = countInfo(el.value), cnt = document.getElementById("cnt" + el.dataset.box);
      if (cnt) { cnt.textContent = c.text; cnt.classList.toggle("warn", c.warn); }
      return;
    }
    if (el.id === "cText") { c.text = el.value; if (!el.value.trim()) c.pasted = false; save(); return; }
    if (el.id === "cNote") { c.note = el.value; save(); return; }
    var name = el.name || el.dataset.bind || "";
    var store = null, key = "";
    if (name.indexOf("p_") === 0) { store = state.profile; key = name.slice(2); }
    else if (name.indexOf("c_") === 0) { store = state.closing; key = name.slice(2); }
    if (!store) return;
    store[key] = el.type === "checkbox" ? checkedValues(el) : el.value;
    save();
    var f = el.closest(".missing"); if (f) f.classList.remove("missing");
  });

  // Pasting is allowed but recorded per question, so the organiser can tell typed questions from pasted ones.
  document.addEventListener("paste", function (e) {
    if (e.target && e.target.id === "cText") { state.composer.pasted = true; save(); }
    if (e.target && e.target.dataset && e.target.dataset.box) { state.boxes[+e.target.dataset.box].pasted = true; save(); }
  });

  render();
})();
</script>

</body>
